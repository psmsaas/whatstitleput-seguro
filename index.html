<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsTitlePut - Tu asesor de ventas de confianza</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#9333ea', // Purple 600
                        secondary: '#000000', // Black
                        bg_chat: '#ffffff', // White
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: #000000;
        }

        .chat-container {
            /* Full height minus header */
            height: calc(100vh - 73px); 
        }

        /* Custom Scrollbar for chat */
        .chat-scroll::-webkit-scrollbar {
            width: 6px;
        }
        
        .chat-scroll::-webkit-scrollbar-track {
            background: transparent; 
        }
        
        .chat-scroll::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 20px;
        }
        
        /* Drag and Drop states */
        .drag-active {
            border-color: #9333ea !important;
            background-color: #faf5ff !important;
        }
        
        /* Typing animation */
        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Message animations */
        .message-in {
            animation: slideInLeft 0.3s ease-out forwards;
        }
        
        .message-out {
            animation: slideInRight 0.3s ease-out forwards;
        }

        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        /* Markdown rendering styles */
        .prose h1, .prose h2, .prose h3 { font-weight: 700; margin-top: 1em; margin-bottom: 0.5em; }
        .prose p { margin-bottom: 0.75em; }
        .prose ul { list-style-type: disc; padding-left: 1.5em; margin-bottom: 0.75em; }
        .prose strong { font-weight: 600; color: #111827; }
    </style>
</head>
<body class="bg-white flex flex-col h-screen overflow-hidden text-black">

    <!-- App Header -->
    <header class="bg-white z-10 p-5 border-b border-gray-200">
        <div class="max-w-4xl mx-auto flex items-center justify-center">
            <h1 class="text-2xl font-bold tracking-tighter">WhatsTitlePut<span class="text-primary">.</span></h1>
        </div>
    </header>

    <!-- Main Chat Area -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col relative chat-container">
        
        <!-- Chat Messages Zone -->
        <div id="chat-messages" class="flex-1 overflow-y-auto chat-scroll flex flex-col space-y-6 pb-4 px-2">
            
            <!-- Welcome Message -->
            <div class="flex w-full mt-4 space-x-4 max-w-2xl">
                <div class="flex-shrink-0 h-10 w-10 rounded-full bg-black flex items-center justify-center text-white font-bold text-sm">
                    AI
                </div>
                <div>
                    <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 text-black">
                        <p class="mb-2">Hola. Sube una imagen y generaré un título SEO optimizado.</p>
                        <p class="text-xs text-gray-500 mt-2">Puedes seleccionar o arrastrar el archivo aquí abajo.</p>
                    </div>
                </div>
            </div>
            
        </div>

        <!-- Input Area (Drag & Drop + Button) -->
        <div class="mt-auto bg-white border-t border-gray-100 pt-4 pb-2 relative transition-all duration-300" id="drop-zone">
            
            <div class="flex items-center justify-between w-full relative gap-3">
                
                <!-- Hidden File Input -->
                <input type="file" id="file-upload" class="hidden" accept="image/*">
                
                <!-- Placeholder / Upload Trigger Area -->
                <div id="upload-trigger" class="flex-1 flex items-center cursor-pointer p-4 border border-dashed border-gray-300 rounded-lg hover:border-primary transition-colors bg-white">
                    <i class="fa-solid fa-plus text-gray-400 mr-3"></i>
                    <div class="flex-1">
                        <p class="text-sm font-medium text-gray-700">Seleccionar o arrastrar imagen</p>
                    </div>
                    <span id="file-name-display" class="text-sm text-primary font-medium hidden max-w-[150px] truncate ml-2"></span>
                </div>

                <!-- Action Button -->
                <button id="send-btn" class="bg-primary hover:opacity-90 text-black rounded-lg px-6 py-4 transition-all flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                    <span class="font-medium">Generar</span>
                </button>
            </div>
            
            <!-- Drag Overlay (Visible only when dragging) -->
            <div id="drag-overlay" class="absolute inset-0 bg-white/90 backdrop-blur-sm rounded-lg border-2 border-primary border-dashed flex-col items-center justify-center hidden z-20 mt-4">
                <i class="fa-solid fa-arrow-down text-3xl text-primary mb-2"></i>
                <p class="font-bold text-primary">Suelta tu imagen aquí</p>
            </div>
        </div>
        
    </main>

    <!-- JavaScript Logic -->
    <script>
        // DOM Elements
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-upload');
        const uploadTrigger = document.getElementById('upload-trigger');
        const fileNameDisplay = document.getElementById('file-name-display');
        const sendBtn = document.getElementById('send-btn');
        const chatMessages = document.getElementById('chat-messages');
        const dragOverlay = document.getElementById('drag-overlay');

        let selectedFile = null;
        let base64ImageData = null;

        // =====================================================================
        // AHORA ESTO ES SEGURO: Llamamos a nuestro propio backend (Vercel)
        // Ya no exponemos la API de Google aquí.
        // =====================================================================
        const BACKEND_URL = '/api/generate';

        // --- Event Listeners for File Selection ---

        // Trigger file input click
        uploadTrigger.addEventListener('click', () => {
            fileInput.click();
        });

        // Handle file selection via click
        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        // --- Drag and Drop Logic ---
        
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
            document.body.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        // Show overlay when dragging over
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => {
                uploadTrigger.classList.add('drag-active');
                dragOverlay.classList.remove('hidden');
                dragOverlay.classList.add('flex');
            }, false);
        });

        // Hide overlay when dragging leaves or drops
        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => {
                uploadTrigger.classList.remove('drag-active');
                dragOverlay.classList.add('hidden');
                dragOverlay.classList.remove('flex');
            }, false);
        });

        // Handle dropped files
        dropZone.addEventListener('drop', (e) => {
            let dt = e.dataTransfer;
            let files = dt.files;
            handleFiles(files);
        }, false);

        // --- File Handling Functions ---

        function handleFiles(files) {
            if (files.length === 0) return;
            
            const file = files[0];
            
            if (!file.type.startsWith('image/')) {
                addMessageToChat('Error', 'Por favor, sube un archivo de imagen válido (JPG, PNG, WebP).');
                return;
            }

            selectedFile = file;
            updateUIWithFile(file);
            
            // Read file as Base64 for the API and to show preview
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function () {
                // Keep the raw base64 data for the API (remove the data:image/png;base64, prefix)
                base64ImageData = reader.result.split(',')[1];
            };
            reader.onerror = function (error) {
                console.error('Error reading file:', error);
                addMessageToChat('Error', 'Hubo un error al procesar la imagen.');
            };
        }

        function updateUIWithFile(file) {
            // Truncate name if too long
            let name = file.name;
            if(name.length > 20) {
                name = name.substring(0, 10) + '...' + name.substring(name.length - 6);
            }
            
            uploadTrigger.querySelector('p:first-of-type').textContent = "Imagen seleccionada";
            fileNameDisplay.textContent = name;
            fileNameDisplay.classList.remove('hidden');
            fileNameDisplay.classList.add('block');
            
            sendBtn.disabled = false;
            sendBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        }

        function resetInputArea() {
            selectedFile = null;
            base64ImageData = null;
            fileInput.value = '';
            uploadTrigger.querySelector('p:first-of-type').textContent = "Seleccionar o arrastrar imagen";
            fileNameDisplay.textContent = "";
            fileNameDisplay.classList.add('hidden');
            fileNameDisplay.classList.remove('block');
            sendBtn.disabled = true;
            sendBtn.classList.add('opacity-50', 'cursor-not-allowed');
        }

        // --- Action Button Logic (Calling API) ---

        sendBtn.addEventListener('click', async () => {
            if (!selectedFile || !base64ImageData) return;

            // 1. Show user message with the uploaded image
            const imageUrl = URL.createObjectURL(selectedFile);
            addUserMessageWithImage(imageUrl);

            // 2. Prepare payload para NUESTRO backend
            const payload = {
                base64ImageData: base64ImageData,
                mimeType: selectedFile.type
            };

            // 3. Reset input UI immediately
            resetInputArea();

            // 4. Show typing indicator
            const typingId = showTypingIndicator();
            scrollToBottom();

            // 5. Call OUR Backend API
            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`Server Error: ${response.status}`);
                }

                const result = await response.json();
                
                removeMessage(typingId);

                if (result.candidates && result.candidates[0].content && result.candidates[0].content.parts) {
                    const generatedText = result.candidates[0].content.parts[0].text;
                    addMessageToChat('IA', generatedText, true);
                } else {
                    throw new Error("Formato de respuesta inesperado");
                }

            } catch (error) {
                console.error("Error calling backend:", error);
                removeMessage(typingId);
                addMessageToChat('Error', 'Lo siento, ocurrió un error al analizar la imagen. Inténtalo de nuevo.');
            }
        });

        // --- Chat UI Helpers ---

        function addUserMessageWithImage(imageUrl) {
            const msgHtml = `
            <div class="flex w-full mt-4 space-x-4 max-w-2xl ml-auto justify-end message-out">
                <div>
                    <div class="bg-white border border-gray-200 p-2 rounded-xl text-black shadow-sm">
                        <img src="${imageUrl}" alt="Imagen subida" class="max-w-[200px] sm:max-w-[300px] rounded-lg object-contain">
                    </div>
                </div>
                <div class="flex-shrink-0 h-10 w-10 rounded-full bg-white border border-gray-300 flex items-center justify-center text-black text-sm font-medium shadow-sm">
                    Tú
                </div>
            </div>`;
            chatMessages.insertAdjacentHTML('beforeend', msgHtml);
            scrollToBottom();
        }

        function addMessageToChat(sender, text, isHtml = false) {
            const isUser = sender !== "IA" && sender !== "Error";
            const isError = sender === "Error";
            
            let content = isHtml ? text : `<p>${text}</p>`;

            const msgHtml = `
            <div class="flex w-full mt-4 space-x-4 max-w-2xl ${isUser ? 'ml-auto justify-end message-out' : 'message-in'}">
                ${!isUser ? `
                <div class="flex-shrink-0 h-10 w-10 rounded-full ${isError ? 'bg-red-500 text-white' : 'bg-black text-white'} flex items-center justify-center font-bold text-sm shadow-sm">
                    ${isError ? '!' : 'AI'}
                </div>
                ` : ''}
                
                <div class="${isUser ? 'order-first mr-4' : ''}">
                    <div class="${isUser ? 'bg-white border border-gray-200' : (isError ? 'bg-white border border-red-200 text-red-600' : 'bg-gray-50 border border-gray-200 text-black')} p-4 rounded-xl shadow-sm">
                        <div class="prose prose-sm">${content}</div>
                        ${!isUser && !isError ? `<button onclick="copyToClipboard(this)" class="mt-3 text-xs flex items-center text-gray-500 hover:text-primary transition-colors font-medium border border-gray-200 rounded px-2 py-1 bg-white" title="Copiar texto"><i class="fa-regular fa-copy mr-1"></i> Copiar</button>` : ''}
                    </div>
                </div>

                ${isUser ? `
                <div class="flex-shrink-0 h-10 w-10 rounded-full bg-white border border-gray-300 flex items-center justify-center text-black text-sm font-medium shadow-sm">
                    Tú
                </div>
                ` : ''}
            </div>`;

            chatMessages.insertAdjacentHTML('beforeend', msgHtml);
            scrollToBottom();
        }

        function showTypingIndicator() {
            const id = 'typing-' + Date.now();
            const msgHtml = `
            <div id="${id}" class="flex w-full mt-4 space-x-4 max-w-2xl message-in">
                <div class="flex-shrink-0 h-10 w-10 rounded-full bg-black flex items-center justify-center text-white font-bold text-sm shadow-sm">
                    AI
                </div>
                <div>
                    <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 flex items-center h-[54px] shadow-sm">
                        <div class="typing-indicator flex">
                            <span class="bg-primary"></span><span class="bg-primary"></span><span class="bg-primary"></span>
                        </div>
                    </div>
                </div>
            </div>`;
            chatMessages.insertAdjacentHTML('beforeend', msgHtml);
            return id;
        }

        function removeMessage(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Global function for the inline onclick handler
        window.copyToClipboard = function(buttonElement) {
            // Find the prose div just above the button
            const proseContainer = buttonElement.previousElementSibling;
            
            // Create a temporary textarea to hold the plain text to copy
            const tempTextArea = document.createElement('textarea');
            // Extract text, keeping some basic formatting (newlines)
            tempTextArea.value = proseContainer.innerText;
            document.body.appendChild(tempTextArea);
            tempTextArea.select();
            
            try {
                const successful = document.execCommand('copy');
                if(successful) {
                    // Visual feedback
                    const originalHtml = buttonElement.innerHTML;
                    buttonElement.innerHTML = `<i class="fa-solid fa-check mr-1"></i> Copiado`;
                    buttonElement.classList.add('text-primary', 'border-primary');
                    setTimeout(() => {
                        buttonElement.innerHTML = originalHtml;
                        buttonElement.classList.remove('text-primary', 'border-primary');
                    }, 2000);
                }
            } catch (err) {
                console.error('Failed to copy text: ', err);
            }
            
            document.body.removeChild(tempTextArea);
        }

    </script>
</body>
</html>
